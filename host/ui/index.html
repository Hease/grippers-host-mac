<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>로봇 시연 UI</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nanum+Gothic:wght@400;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
<script>
// 스크립트 오류를 삼키지 않는다 — 화면이 검게만 뜨면 원인을 알 수가 없어서,
// 여기에 모아두고 화면 아래에도 한 줄로 띄운다(ui/app.js 의 showBootError).
window.__errs = [];
window.addEventListener("error", function (e) {
  window.__errs.push((e.filename || "").split("/").pop() + ":" + e.lineno + " " + e.message);
  if (window.showBootError) window.showBootError(window.__errs[window.__errs.length - 1]);
});
window.addEventListener("unhandledrejection", function (e) {
  window.__errs.push("promise: " + e.reason);
});
</script>
</head>
<body>
<div id="viewport">
  <!-- 432 x 768 논리 픽셀. #stage 배율로 1080 x 1920 이 된다(정확히 2.5배).
       구성은 "로봇 시연 UI 목업.dc.html" 의 1a – 1m 을 따른다. -->
  <div id="stage">

    <!-- ══ 1a · 대기 (Stage 0) ══════════════════════════════ -->
    <section class="screen" id="scIdle">
      <div class="idlebody">
        <div class="mono label" id="idleLabel">READY</div>
        <div class="inputrow">
          <!-- 진짜 입력창이다. 마이크가 안 되는 자리(시뮬레이터·소음)에서
               타이핑으로도 명령할 수 있어야 한다 — 예전 live_map.py 의
               "지시" 패널이 하던 일. Enter 로 전송. -->
          <div class="field big">
            <input class="inp" id="idleInput" type="text" autocomplete="off"
                   spellcheck="false" placeholder="무엇을 시킬까요?">
          </div>
          <div class="mic big" id="micIdle">
            <div class="halo"></div>
            <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#8B7BFF"
                 stroke-width="1.8" stroke-linecap="round">
              <rect x="9" y="2.5" width="6" height="11" rx="3"></rect>
              <path d="M5 11a7 7 0 0 0 14 0M12 18v3.5"></path>
            </svg>
          </div>
        </div>
        <div class="hints">
          <div class="h1" id="hint1"></div>
          <div class="h2" id="hint2"></div>
          <div class="h3" id="hint3"></div>
          <div class="dots" id="hintDots"></div>
        </div>
      </div>
    </section>

    <!-- ══ 1i · 음성 입력 중 ════════════════════════════════ -->
    <section class="screen" id="scListen">
      <div class="listenbody">
        <div class="biggie">
          <div class="halo big"></div>
          <div class="orb">
            <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#0A0F18"
                 stroke-width="2" stroke-linecap="round">
              <rect x="9" y="2.5" width="6" height="11" rx="3"></rect>
              <path d="M5 11a7 7 0 0 0 14 0M12 18v3.5"></path>
            </svg>
          </div>
        </div>
        <div class="wave" id="wave"></div>
        <div class="partial" id="partialText"></div>
        <!-- 목업 1i 는 "자동으로 전송돼요"인데 이 구현은 자동 전송을 하지 않는다.
           인식 결과를 보여주고 사람이 확인한 뒤 보낸다(오인식 안전장치, DEMO_UI.md).
           실제 문구는 ui_state 가 매 프레임 덮어쓰지만, 창이 뜨는 첫 프레임에
           지키지도 못할 약속이 잠깐 보이면 안 되므로 정적 문구도 맞춰 둔다. -->
        <div class="listenhint" id="listenHint">듣고 있습니다 · 말이 끝나면 자동으로 인식합니다</div>
      </div>
    </section>

    <!-- ══ 1b · 접수 · 해석 (Stage 1) ═══════════════════════ -->
    <section class="screen" id="scCommand">
      <div class="cmdhead">
        <div class="mono label">COMMAND</div>
        <div class="cmdtext" id="cmdText"></div>
        <div class="rule"></div>
        <div class="interp">
          <span class="idot" id="interpDot"></span>
          <span class="itext" id="interpText"></span>
          <span class="mono icode" id="interpCode"></span>
        </div>
      </div>
      <div class="mapslot faint"><div class="mapbox" id="mapCommand"></div></div>
      <div class="echorow">
        <div class="echo" id="echoText"></div>
        <!-- 목업 1b 의 46px 원형 버튼. 인식이 확정되면(FINAL) 전송 버튼이 되고,
             그 밖에는 "다시 말하기" 마이크로 돌아간다. voice_input.py 가 일부러
             자동 전송을 안 하므로(오인식 안전장치) 보낼 방법이 반드시 필요하다. -->
        <div class="mic sm" id="micCommand">
          <svg class="ic-mic" width="18" height="18" viewBox="0 0 24 24" fill="none"
               stroke="#3A4757" stroke-width="1.8" stroke-linecap="round">
            <rect x="9" y="2.5" width="6" height="11" rx="3"></rect>
            <path d="M5 11a7 7 0 0 0 14 0M12 18v3.5"></path>
          </svg>
          <svg class="ic-send hide" width="19" height="19" viewBox="0 0 24 24" fill="none"
               stroke="#0A0F18" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 20V5M5.5 11.5 12 5l6.5 6.5"></path>
          </svg>
        </div>
      </div>
    </section>

    <!-- ══ 1c – 1g · 실행 (Stage 2 · 3) ═════════════════════ -->
    <section class="screen" id="scRun">
      <div class="runhead">
        <div class="quote" id="runQuote"></div>
        <div class="rule"></div>
      </div>
      <div class="mapslot"><div class="mapbox" id="mapRun"></div></div>

      <!-- Stage 2 · 대상 요약 줄 -->
      <div class="targetrow" id="targetRow">
        <svg class="ticon" id="targetIcon" width="30" height="30" viewBox="0 0 24 24"></svg>
        <div class="tmid">
          <div class="tname" id="targetName"></div>
          <div class="treason" id="targetReason"></div>
        </div>
        <div class="tdist">
          <div class="mono dlabel">DISTANCE</div>
          <div class="mono dval" id="targetDist"></div>
        </div>
      </div>

      <!-- Stage 3 · 상태 · 진행률 -->
      <div class="statusblock" id="statusBlock">
        <div class="sbrow1">
          <span class="sdot" id="sdot"></span>
          <span class="sko" id="statusKo"></span>
          <span class="mono sen" id="statusEn"></span>
        </div>
        <div class="pbar"><div class="pfill" id="pfill"></div></div>
        <div class="sbrow2">
          <span class="step" id="stepKo"></span>
          <span class="mono metric" id="metricWrap">
            <svg class="gripicon" id="gripIcon" width="20" height="10" viewBox="0 0 24 12"
                 fill="none" stroke="#FF6B4A" stroke-width="2" stroke-linecap="round">
              <path d="M4 1c-2 3.5-2 6.5 0 10M20 1c2 3.5 2 6.5 0 10"></path>
            </svg><span id="metric"></span>
          </span>
        </div>
      </div>

      <!-- Stage 2 · 명령 추가 바 -->
      <div class="addrow" id="addRow">
        <input class="addfield inp" id="addField" type="text" autocomplete="off"
               spellcheck="false" placeholder="명령 추가…">
        <div class="mono tag" id="legendToggle">범례 ⌄</div>
      </div>

      <!-- Stage 3 · DETAIL 접기/펼치기 -->
      <div class="detailrow" id="detailRow">
        <span class="mono dtitle" id="detailTitle">DETAIL</span>
        <span class="dline"></span>
        <span class="mono tag" id="detailToggle">⌄ 펼치기</span>
      </div>
    </section>

    <!-- ══ 1h · 완료 (Stage 4) ══════════════════════════════ -->
    <section class="screen" id="scDone">
      <div class="donehead">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#3DE8B0"
             stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 12.5 9.5 18 20 6"></path>
        </svg>
        <div class="donetitle" id="doneTitle"></div>
      </div>
      <div class="donesub" id="doneSub"></div>
      <div class="mapslot done"><div class="mapbox" id="mapDone"></div></div>
      <div class="inputrow next">
        <div class="field mid">
          <input class="inp" id="doneInput" type="text" autocomplete="off"
                 spellcheck="false" placeholder="다음 명령…">
        </div>
        <div class="mic mid" id="micDone">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#8B7BFF"
               stroke-width="1.8" stroke-linecap="round">
            <rect x="9" y="2.5" width="6" height="11" rx="3"></rect>
            <path d="M5 11a7 7 0 0 0 14 0M12 18v3.5"></path>
          </svg>
        </div>
      </div>
    </section>

    <!-- ══ 1k · 디버그 패널 (DETAIL 펼침) ═══════════════════ -->
    <div class="panel" id="detailPanel">
      <div class="panelhead">
        <span class="mono dtitle">DETAIL</span>
        <span class="dline"></span>
        <span class="mono tag on" id="detailCollapse">⌃ 접기</span>
      </div>
      <div class="grid3" id="detailGrid"></div>
      <div class="gline"></div>
      <div class="batts">
        <div class="batt"><span class="mono bk">VEH</span><div class="bbar"><i id="battVeh"></i></div><span class="mono bv" id="battVehTxt">—</span></div>
        <div class="batt"><span class="mono bk">ARM</span><div class="bbar"><i id="battArm"></i></div><span class="mono bv" id="battArmTxt">—</span></div>
      </div>
    </div>

    <!-- ══ 1l · 범례 (펼침) ═════════════════════════════════ -->
    <div class="panel" id="legendPanel">
      <div class="panelhead">
        <span class="mono dtitle" id="legendTitle">LEGEND · 기물 6종</span>
        <span class="dline"></span>
        <span class="mono tag on" id="legendCollapse">⌃ 접기</span>
      </div>
      <div class="grid3 legend" id="legendGrid"></div>
    </div>

    <!-- ══ 알림 배너 · 차단 카드 ════════════════════════════ -->
    <div class="toast hide" id="toast">
      <i class="tdot"></i>
      <span class="ttext" id="toastText"></span>
      <span class="mono ttag" id="toastCode"></span>
    </div>

    <div class="cardov hide" id="cardov">
      <div class="cardicon" id="cardIcon">!</div>
      <div class="cardtitle" id="cardTitle"></div>
      <div class="carddetail" id="cardDetail"></div>
      <div class="cardrows" id="cardRows"></div>
      <div class="cardactions" id="cardActions"></div>
      <div class="cardfoot"><span class="mono" id="cardCode"></span><span class="mono" id="cardNext"></span></div>
    </div>

    <!-- ══ 1m · 하단 운영 트레이 (모든 화면 고정) ═══════════ -->
    <div class="tray">
      <div class="estop" id="estop"><span class="sq"></span><span id="estopLabel">비상 정지</span></div>
      <!-- 목업 1m · HALTED: 정지 중에만 뜨는 빨간 한 줄. 버튼이 "정지됨 · 해제"로
           바뀌는 것만으로는 지금 구동이 멎어 있다는 사실이 안 읽힌다. -->
      <div class="haltnote hide" id="haltNote">모든 구동 중단됨</div>
      <div class="traygrow" id="trayGrow"></div>
      <div class="traybtns">
        <span class="mono tb" id="modeBtn">AUTO</span>
        <span class="mono tb" id="resetBtn">Reset</span>
        <span class="mono tb" id="prevBtn">Prev</span>
        <span class="mono tb" id="nextBtn">Next</span>
      </div>
      <span class="led" id="led"></span>
      <span class="mono trayexp" id="trayExpand">v ⌃</span>
    </div>

    <div class="booterr hide" id="booterr"></div>
    <div class="estopframe" id="estopframe"></div>
  </div>
</div>

<script src="arena.js"></script>
<script src="app.js"></script>
<script src="mock.js"></script>
</body>
</html>
